id = "herdr-agents-overview"
name = "Herdr Agents Overview"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Multi-machine agent overview for Herdr across local and remote SSH machines."
platforms = ["linux", "macos"]

[[actions]]
id = "list"
title = "List All Agents"
description = "Show table of active agents across all connected machines"
contexts = ["global"]
command = ["python3", "bin/agents-overview.py"]

[[actions]]
id = "json"
title = "Export Agents JSON"
description = "Dump active agents across all connected machines as JSON"
contexts = ["global"]
command = ["python3", "bin/agents-overview.py", "--format", "json"]

[[panes]]
id = "overview"
title = "Cluster Agents"
placement = "overlay"
command = ["python3", "bin/agents-overview.py", "--interactive"]
